<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Próximamente | EldinBridge</title>

    <style>
        :root {
            --fondo: #070911;
            --texto: #f7f8ff;
            --secundario: #aeb5cd;
            --morado: #8b5cf6;
            --azul: #38bdf8;
            --rosa: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: grid;
            min-height: 100svh;
            overflow: hidden;
            place-items: center;
            padding: 24px;
            color: var(--texto);
            background:
                radial-gradient(
                    circle at 12% 15%,
                    rgba(139, 92, 246, .22),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 88% 82%,
                    rgba(56, 189, 248, .17),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 70% 10%,
                    rgba(236, 72, 153, .12),
                    transparent 25%
                ),
                var(--fondo);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .contenido {
            width: min(100%, 720px);
            padding: clamp(34px, 7vw, 72px);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 30px;
            text-align: center;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .08),
                    rgba(255, 255, 255, .025)
                );
            box-shadow: 0 28px 90px rgba(0, 0, 0, .42);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .etiqueta {
            display: inline-flex;
            margin-bottom: 20px;
            padding: 7px 13px;
            border: 1px solid rgba(139, 92, 246, .36);
            border-radius: 999px;
            color: #d9ceff;
            background: rgba(139, 92, 246, .1);
            font-size: .76rem;
            font-weight: 800;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        h1 {
            color: transparent;
            background:
                linear-gradient(
                    90deg,
                    #b99cff,
                    #76d4ff 50%,
                    #ff8dc7
                );
            background-clip: text;
            -webkit-background-clip: text;
            font-size: clamp(3rem, 10vw, 6.5rem);
            line-height: .95;
            letter-spacing: -.065em;
        }

        p {
            max-width: 480px;
            margin: 24px auto 0;
            color: var(--secundario);
            font-size: clamp(.95rem, 2vw, 1.1rem);
            line-height: 1.65;
        }

        .volver {
            display: inline-flex;
            margin-top: 30px;
            padding: 11px 18px;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 999px;
            color: var(--texto);
            background: rgba(255, 255, 255, .055);
            font-weight: 750;
            text-decoration: none;
            transition:
                transform .2s ease,
                background .2s ease;
        }

        .volver:hover {
            background: rgba(255, 255, 255, .1);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .contenido {
                padding: 40px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: clamp(3rem, 16vw, 4.4rem);
            }
        }
    </style>
</head>

<body>
    <main class="contenido">

        <span class="etiqueta">
            EldinBridge
        </span>

        <h1>Próximamente</h1>

        <p>
            Estamos preparando esta sección.
            Muy pronto podrás conocer todos los detalles.
        </p>

        <a class="volver" href="../">
            ← Volver a la página principal
        </a>

    </main>
</body>

</html>
