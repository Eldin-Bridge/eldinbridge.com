<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contacta a EldinBridge por WhatsApp o correo electrónico.">

    <title>Contacto | EldinBridge</title>

    <style>
        :root {
            --fondo: #070911;
            --texto: #f7f8ff;
            --secundario: #aeb5cd;
            --morado: #8b5cf6;
            --azul: #38bdf8;
            --rosa: #ec4899;
            --verde: #25d366;
            --borde: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            color: var(--texto);
            background:
                radial-gradient(circle at 12% 10%,
                    rgba(139, 92, 246, 0.2),
                    transparent 30%),
                radial-gradient(circle at 90% 35%,
                    rgba(56, 189, 248, 0.16),
                    transparent 32%),
                radial-gradient(circle at 45% 100%,
                    rgba(236, 72, 153, 0.11),
                    transparent 35%),
                var(--fondo);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        a {
            color: inherit;
        }

        .contenedor {
            width: min(100% - 32px, 760px);
            margin-inline: auto;
            padding: 28px 0 60px;
        }

        .barra-superior {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 22px;
        }

        .volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 15px;
            border: 1px solid var(--borde);
            border-radius: 999px;
            color: var(--texto);
            background: rgba(255, 255, 255, 0.055);
            font-size: 0.86rem;
            font-weight: 750;
            text-decoration: none;
            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .volver:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .presentacion {
            margin-bottom: 28px;
            text-align: center;
        }

        .icono-contacto {
            display: grid;
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            background:
                linear-gradient(145deg,
                    rgba(139, 92, 246, 0.85),
                    rgba(56, 189, 248, 0.72));
            box-shadow:
                0 18px 38px rgba(0, 0, 0, 0.32),
                inset 0 1px rgba(255, 255, 255, 0.22);
            font-size: 2rem;
        }

        h1 {
            color: transparent;
            background:
                linear-gradient(90deg,
                    #b99cff,
                    #76d4ff 52%,
                    #ff8dc7);
            background-clip: text;
            -webkit-background-clip: text;
            font-size: clamp(2.8rem, 9vw, 5rem);
            line-height: 1;
            letter-spacing: -0.055em;
        }

        .presentacion p {
            max-width: 500px;
            margin: 17px auto 0;
            color: var(--secundario);
            font-size: clamp(0.95rem, 2vw, 1.08rem);
            line-height: 1.6;
        }

        .tarjeta-contacto {
            padding: clamp(22px, 5vw, 38px);
            border: 1px solid var(--borde);
            border-radius: 28px;
            background:
                linear-gradient(145deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.025));
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .opciones {
            display: grid;
            gap: 14px;
        }

        .opcion {
            display: flex;
            min-width: 0;
            min-height: 78px;
            align-items: center;
            gap: 16px;
            padding: 15px 18px;
            border: 1px solid var(--borde);
            border-radius: 19px;
            color: var(--texto);
            background: rgba(255, 255, 255, 0.045);
            text-decoration: none;
            transition:
                transform 0.22s ease,
                border-color 0.22s ease,
                background 0.22s ease;
        }

        .opcion:hover {
            border-color: rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
        }

        .opcion-icono {
            display: grid;
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 15px;
            font-size: 1.4rem;
        }

        .whatsapp-logo {
            display: block;
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .whatsapp .opcion-icono {
            background: rgba(37, 211, 102, 0.16);
        }

        .correo .opcion-icono {
            background: rgba(56, 189, 248, 0.15);
        }

        .opcion-texto {
            min-width: 0;
            flex: 1;
        }

        .opcion-titulo {
            display: block;
            margin-bottom: 3px;
            font-size: 1rem;
            font-weight: 850;
        }

        .opcion-dato {
            display: block;
            overflow-wrap: anywhere;
            color: var(--secundario);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .opcion-flecha {
            flex: 0 0 auto;
            color: var(--secundario);
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .opcion:hover .opcion-flecha {
            transform: translateX(4px);
        }

        .whatsapp {
            border-color: rgba(37, 211, 102, 0.24);
            background:
                linear-gradient(135deg,
                    rgba(37, 211, 102, 0.13),
                    rgba(255, 255, 255, 0.035));
        }

        .correo {
            border-color: rgba(56, 189, 248, 0.2);
        }

        .nota {
            margin-top: 20px;
            color: var(--secundario);
            font-size: 0.82rem;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 600px) {
            .contenedor {
                width: min(100% - 24px, 760px);
                padding-top: 18px;
            }

            .barra-superior {
                margin-bottom: 18px;
            }

            .icono-contacto {
                width: 62px;
                height: 62px;
                margin-bottom: 17px;
                border-radius: 19px;
                font-size: 1.75rem;
            }

            h1 {
                font-size: clamp(2.5rem, 13vw, 3.8rem);
            }

            .presentacion {
                margin-bottom: 24px;
            }

            .tarjeta-contacto {
                padding: 18px;
                border-radius: 23px;
            }

            .opcion {
                min-height: 72px;
                gap: 12px;
                padding: 13px;
                border-radius: 17px;
            }

            .opcion-icono {
                width: 44px;
                height: 44px;
                border-radius: 13px;
                font-size: 1.25rem;
            }

            .whatsapp-logo {
                width: 27px;
                height: 27px;
            }

            .opcion-titulo {
                font-size: 0.92rem;
            }

            .opcion-dato {
                font-size: 0.76rem;
            }
        }

        @media (max-width: 350px) {
            .tarjeta-contacto {
                padding: 14px;
            }

            .opcion {
                gap: 9px;
                padding: 11px;
            }

            .opcion-icono {
                width: 40px;
                height: 40px;
            }

            .opcion-flecha {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">

        <header class="barra-superior">
            <a class="volver" href="../">
                ← Volver
            </a>
        </header>

        <section class="presentacion">
            <div class="icono-contacto" aria-hidden="true">
                💬
            </div>

            <h1>Contacto</h1>

            <p>
                Solicita información.
            </p>
        </section>

        <section class="tarjeta-contacto" aria-label="Opciones de contacto">
            <div class="opciones">

                <a class="opcion whatsapp"
                    href="https://wa.me/528281436194?text=Hola%2C%20vi%20sus%20servicios%20en%20EldinBridge%20y%20me%20gustar%C3%ADa%20solicitar%20informaci%C3%B3n."
                    target="_blank" rel="noopener noreferrer">

                    <span class="opcion-icono" aria-hidden="true">
                        <img class="whatsapp-logo" src="./assets/whatsapp-icon.webp?v=1" 
                        alt="">
                    </span>

                    <span class="opcion-texto">
                        <span class="opcion-titulo">
                            Contactar por WhatsApp
                        </span>

                        <span class="opcion-dato">
                            Respuesta directa para consultas y servicios
                        </span>
                    </span>

                    <span class="opcion-flecha" aria-hidden="true">
                        →
                    </span>
                </a>

                <a class="opcion correo"
                    href="mailto:contacto.eldinbridge@gmail.com?subject=Consulta%20sobre%20los%20servicios%20de%20EldinBridge">
                    <span class="opcion-icono" aria-hidden="true">
                        ✉️
                    </span>

                    <span class="opcion-texto">
                        <span class="opcion-titulo">
                            Enviar correo
                        </span>

                        <span class="opcion-dato">
                            contacto.eldinbridge@gmail.com
                        </span>
                    </span>

                    <span class="opcion-flecha" aria-hidden="true">
                        →
                    </span>
                </a>

            </div>

            <p class="nota">
                Elige el medio que prefieras y responderemos lo antes posible.
            </p>
        </section>

    </main>
</body>

</html>
